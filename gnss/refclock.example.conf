# Example GNSS recipe for: timesync master --refclock-file F --gps-device D
#
# F is a chrony config snippet.  It is installed verbatim as
# /etc/chrony/conf.d/20-ptp-refclock.conf, so every line here is read by chrony
# on the board.  Nothing in it is generated or guessed by the tool: which
# receiver is wired to which device is a property of the hardware, so you copy
# this file, edit it for your receiver, and pass the edited copy.
#
#   cp gnss/refclock.example.conf gnss/refclock.conf
#   $EDITOR gnss/refclock.conf
#   timesync master --refclock-file gnss/refclock.conf --gps-device /dev/pps0 \
#                   --advertise-gnss-quality
#
# Where the real values come from:
#
#   * the receiver's manual -- a GNSS module datasheet usually carries a chrony
#     or gpsd example for that exact model; or
#   * /etc/chrony/conf.d/ on a bench unit where the same receiver already
#     disciplines chrony.  That source is the better one, because it is known to
#     work with your driver stack and not just with the vendor's.
#
# Two things have to be true before the board ships, and neither can be checked
# from here:
#
#   1. The device below is this board's device, and this file mentions it -- the
#      tool greps this file for --gps-device on purpose, because a recipe copied
#      from a differently wired unit is the classic fleet-wide mistake.
#   2. It actually works on this hardware.  On one bench unit:
#         chronyc sources -v      # the refclock appears, reachability 377
#         chronyc tracking        # Reference ID is the refclock, Offset in us
#      and then `timesync verify` stops returning 5.
#
# ---------------------------------------------------------------------------
# Keep the refclock lines that match your hardware and delete the rest.  A
# receiver with a PPS output is normally both of the ones below.
# ---------------------------------------------------------------------------

# NMEA sentences, delivered through gpsd's shared-memory segment.  `SHM 0` is
# gpsd's default segment; GPS is an arbitrary four-character refid you will see
# in chronyc.  Precision is gpsd's typical NMEA jitter, roughly 100 ms.
refclock SHM 0 refid GPS precision 1e-1 offset 0.0 delay 0.2

# The PPS pulse, on the kernel PPS device that the receiver's pulse is bound to.
# `lock GPS` stops chrony from using the pulse until it knows which second it
# belongs to.  On a board without a PPS line, delete this line.
refclock PPS /dev/pps0 refid PPS lock GPS prefer

# A gpsd/SHM recipe does not name the serial port itself, and the tool requires
# the device you pass in --gps-device to appear in this file.  Naming it in a
# comment satisfies that check and documents the wiring for the next person.
# Delete this if one of the refclock lines above already names your device.
# port: /dev/ttyUSB0
